name: Stage 0 verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run experiment
      - run: git diff --exit-code -- ../experiments/results/stage0-baseline.json
      - run: npm run experiment:v2
      - run: git diff --exit-code -- ../experiments/results/tiered-benchmark-v2.json
      - run: npm audit --audit-level=high
