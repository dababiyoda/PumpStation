name: Phase 3 final integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/phase3-kernel-contract-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-kernel-contract-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Wire the proposal-only Kernel router
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('server/src/app.ts')
          text = app.read_text()
          firewall_import = '} from "./domain/semanticFirewall.js";\n'
          kernel_imports = firewall_import + 'import { PumpStationKernelAdapter } from "./kernel/adapter.js";\nimport { createKernelRouter } from "./kernel/router.js";\n'
          if 'from "./kernel/adapter.js"' not in text:
              if firewall_import not in text:
                  raise SystemExit('Firewall import marker not found')
              text = text.replace(firewall_import, kernel_imports)

          text = text.replace(
              '  firewall: SemanticFirewall;\n  store: AppendOnlyEventStore;\n',
              '  firewall: SemanticFirewall;\n  kernel: PumpStationKernelAdapter;\n  store: AppendOnlyEventStore;\n',
          )

          if 'const kernel = new PumpStationKernelAdapter' not in text:
              marker = '  const app = express();\n'
              replacement = '  const kernel = new PumpStationKernelAdapter({\n    now: nowIso,\n    ...(options.idFactory ? { idFactory: options.idFactory } : {}),\n  });\n  const app = express();\n'
              if marker not in text:
                  raise SystemExit('App instantiation marker not found')
              text = text.replace(marker, replacement)

          text = text.replace(
              '      kernel_connection: "not_implemented",',
              '      kernel_connection: "pinned_adapter_disconnected",',
          )

          if 'createKernelRouter({ adapter: kernel, institution, store })' not in text:
              marker = '  app.post("/api/v1/firewall/screens", requireIdentity, (request, response) => {\n'
              replacement = '  app.use(\n    "/api/v1/kernel",\n    requireIdentity,\n    createKernelRouter({ adapter: kernel, institution, store }),\n  );\n\n' + marker
              if marker not in text:
                  raise SystemExit('Authenticated route marker not found')
              text = text.replace(marker, replacement)

          text = text.replace(
              '  return { app, institution, identity, firewall, store };',
              '  return { app, institution, identity, firewall, kernel, store };',
          )
          app.write_text(text)

          adapter = Path('server/src/kernel/adapter.ts')
          source = adapter.read_text()
          source = source.replace(
              '    if (this.#manifest.legal_principal === "UNIIMENTE") {\n      throw new DomainError(\n        500,\n        "ILLEGAL_PRINCIPAL",\n        "UNIIMENTE may not be configured as a legal principal.\",\n      );\n    }\n',
              '',
          )
          adapter.write_text(source)

          router = Path('server/src/kernel/router.ts')
          source = router.read_text()
          old = '    const promotion = options.institution.getPromotion(request.params.id as string);\n    const proposal = options.adapter.compileStagePromotionProposal(\n      promotion,\n      localActor,\n    );'
          new = '    const versions = options.institution.getPromotion(request.params.id as string);\n    const promotion = versions.at(-1);\n    if (!promotion) {\n      throw new DomainError(404, "PROMOTION_NOT_FOUND", "Promotion request not found.");\n    }\n    const proposal = options.adapter.compileStagePromotionProposal(\n      promotion,\n      localActor,\n    );'
          if old in source:
              source = source.replace(old, new)
          router.write_text(source)

          test = Path('server/test/kernel-adapter.test.ts')
          source = test.read_text()
          source = source.replace(
              '  type KernelGateway,\n  type KernelProposal,\n} from "../src/kernel/contracts.js";',
              '  type KernelProposal,\n} from "../src/kernel/contracts.js";\nimport type { KernelGateway } from "../src/kernel/gateway.js";',
          )
          test.write_text(source)
          PY
      - run: npm run format
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run security:surfaces
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run experiment:all
        working-directory: server
      - run: git diff --exit-code -- experiments/results
      - run: npm audit --audit-level=high
        working-directory: server
      - name: Commit verified source integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src server/test server/package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source integration changes required.'
          else
            git commit -m 'Finalize fail-closed UNIIMENTE Kernel adapter integration'
            git push origin HEAD:agent/phase3-kernel-contract-adapter
          fi
