name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run format
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            server/src/experimentV2.ts
            server/scripts/run-experiment-v2.ts
            server/test/experiment-v2.test.ts
          if-no-files-found: error
          retention-days: 1
