name: admission gate

# The founder's termination trigger, enforced in CI:
#
#   Reject any feature that expands authority or financial exposure without a
#   measurable security benefit, bounded failure radius and tested recovery path.
#
# A gate that only runs when someone remembers to run it is a suggestion.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Admission gate
        run: node governance/check.js

      - name: Gate rule tests
        run: node --test governance/test/*.test.js

      - name: Wallet authentication security tests
        working-directory: server
        run: npm test
