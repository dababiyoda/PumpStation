name: Phase 3 proof capsule

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/phase3-kernel-contract-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-kernel-contract-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Ensure proposal-only API wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('server/src/app.ts')
          text = app.read_text()
          firewall_import = '} from "./domain/semanticFirewall.js";\n'
          if 'from "./kernel/adapter.js"' not in text:
              text = text.replace(
                  firewall_import,
                  firewall_import + 'import { PumpStationKernelAdapter } from "./kernel/adapter.js";\nimport { createKernelRouter } from "./kernel/router.js";\n',
              )
          text = text.replace(
              '  firewall: SemanticFirewall;\n  store: AppendOnlyEventStore;\n',
              '  firewall: SemanticFirewall;\n  kernel: PumpStationKernelAdapter;\n  store: AppendOnlyEventStore;\n',
          )
          if 'const kernel = new PumpStationKernelAdapter' not in text:
              text = text.replace(
                  '  const app = express();\n',
                  '  const kernel = new PumpStationKernelAdapter({\n    now: nowIso,\n    ...(options.idFactory ? { idFactory: options.idFactory } : {}),\n  });\n  const app = express();\n',
              )
          text = text.replace(
              '      kernel_connection: "not_implemented",',
              '      kernel_connection: "pinned_adapter_disconnected",',
          )
          marker = '  app.post("/api/v1/firewall/screens", requireIdentity, (request, response) => {\n'
          if 'createKernelRouter({ adapter: kernel, institution, store })' not in text:
              text = text.replace(
                  marker,
                  '  app.use(\n    "/api/v1/kernel",\n    requireIdentity,\n    createKernelRouter({ adapter: kernel, institution, store }),\n  );\n\n' + marker,
              )
          text = text.replace(
              '  return { app, institution, identity, firewall, store };',
              '  return { app, institution, identity, firewall, kernel, store };',
          )
          app.write_text(text)
          PY
      - run: npm run format
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run security:surfaces
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run experiment:all
        working-directory: server
      - run: git diff --exit-code -- experiments/results
      - run: npm audit --audit-level=high
        working-directory: server
      - name: Write sandbox proof capsule
        run: |
          mkdir -p proof
          cat > proof/phase3-kernel-adapter-verification.json <<'JSON'
          {
            "proof_id": "pumpstation-phase3-kernel-adapter-v1",
            "reality_status": "VERIFIED_SANDBOX",
            "production_verified": false,
            "external_effects": false,
            "unauthorized_external_effects": 0,
            "kernel_repository": "dababiyoda/uniimente-kernel",
            "kernel_commit": "3d9b5779a7093d6ddd07f225c8329ead6d0c6393",
            "pumpstation_identity_status": "proposed_not_registered",
            "gateway_status": "disconnected_deny_all",
            "capital_authorization_usd": 0,
            "autonomy_level": 0,
            "checks": {
              "format": "passed",
              "strict_typecheck": "passed",
              "full_tests": "passed",
              "prohibited_surface_scan": "passed",
              "production_build": "passed",
              "all_experiment_regeneration": "passed_no_drift",
              "high_severity_dependency_audit": "passed"
            },
            "does_not_prove": [
              "live Kernel transport",
              "registered workload identity",
              "Kernel-issued grant",
              "production security",
              "legal clearance",
              "commit-time execution revalidation",
              "effect receipt or reconciliation",
              "public readiness",
              "external or financial outcome"
            ]
          }
          JSON
      - name: Commit verified source and proof capsule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/app.ts server/src/kernel server/test/kernel-*.test.ts proof/phase3-kernel-adapter-verification.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Verified proof capsule already current.'
          else
            git commit -m 'Record verified sandbox Kernel adapter proof'
            git push origin HEAD:agent/phase3-kernel-contract-adapter
          fi
